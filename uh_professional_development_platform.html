        const currentCarouselEvent = carouselEvents[carouselIndex] || carouselEvents[0];

          if (!isAutoplay || isCarouselHovered) return;
          const timer = setTimeout(() => {
            setCarouselIndex(prev => (prev + 1) % carouselEvents.length);
          }, 5500);
          return () => clearTimeout(timer);
        }, [isAutoplay, isCarouselHovered, carouselIndex, carouselEvents.length]);

        const handleTouchStart = (e) => {
          setTouchStartX(e.touches[0].clientX);
        };

        const handleTouchEnd = (e) => {
          if (touchStartX === null) return;
          const touchEndX = e.changedTouches[0].clientX;
          const diff = touchStartX - touchEndX;
          if (diff > 50) {
            setCarouselIndex(prev => (prev + 1) % carouselEvents.length);
          } else if (diff < -50) {
            setCarouselIndex(prev => (prev === 0 ? carouselEvents.length - 1 : prev - 1));

        const filteredEvents = React.useMemo(() => {
          return events.filter(evt => {
            const matchesQuery = !searchQuery || 
              evt.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
              evt.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
              evt.dept.toLowerCase().includes(searchQuery.toLowerCase()) ||
              evt.pedagogy_tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));

            if (selectedCampus !== "All campuses") {
              if (selectedCampus === "UH System") {
                matchesCampus = evt.campus === "UH System" || evt.is_systemwide;
              } else {
                matchesCampus = evt.campus === selectedCampus || evt.is_systemwide;
              }
            }

            const matchesTopic = selectedTopic === "All topics" || evt.pedagogy_tags.some(t => t.toLowerCase().includes(selectedTopic.toLowerCase()));

            let matchesFormat = true;
            if (selectedFormat !== "All formats") {
              if (selectedFormat.includes("Hybrid")) matchesFormat = evt.delivery_mode === "hybrid";
              else if (selectedFormat.includes("sync")) matchesFormat = evt.delivery_mode === "online_sync";
              else if (selectedFormat.includes("In-person")) matchesFormat = evt.delivery_mode === "f2f";
              else if (selectedFormat.includes("async")) matchesFormat = evt.delivery_mode === "online_async";
            }

            let matchesQuick = true;
            if (quickChoice === "thisMonth") {
              matchesQuick = evt.monthKey === "2026-09";
            } else if (quickChoice === "liveOnline") {
              matchesQuick = evt.delivery_mode === "online_sync" || evt.delivery_mode === "hybrid";
            } else if (quickChoice === "seatsAvailable") {
              matchesQuick = (evt.capacity_virtual > evt.registered_virtual) || (evt.capacity_in_person > evt.registered_in_person);
            } else if (quickChoice === "selfPaced") {
              matchesQuick = evt.delivery_mode === "online_async";
            } else if (quickChoice === "next7") {
              matchesQuick = evt.dateNum <= 15 && evt.monthKey === "2026-09";
            }

            return matchesQuery && matchesCampus && matchesTopic && matchesFormat && matchesQuick;
          });
        }, [events, searchQuery, selectedCampus, selectedTopic, selectedFormat, quickChoice]);

        const groupedEvents = React.useMemo(() => {
          const groups = {};
          filteredEvents.forEach(evt => {
            if (!groups[evt.month]) {
              groups[evt.month] = [];

          return groups;

        // Resource Filtering
        const filteredResources = React.useMemo(() => {

            return matchesQuery && matchesProvider && matchesCategory && matchesType && matchesAccess;

          const icsContent = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//University of Hawaii//PD Hub Discovery//EN",
            "CALSCALE:GREGORIAN",
            "METHOD:REQUEST",
            "BEGIN:VEVENT",
            `UID:uh-pd-${evt.id}-${Date.now()}@hawaii.edu`,
            `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
            `SUMMARY:UH PD: ${evt.title}`,

            "STATUS:CONFIRMED",
            "END:VEVENT",
            "END:VCALENDAR"

            );

            );

        const handleExtract = async () => {
          if (!rawFlyerText.trim()) {
            showToast("Please enter or paste flyer text first.", "info");
            return;

          setIsParsing(true);
          try {
            const systemPrompt = `You are the AI Intake Assistant for the University of Hawaii PD Platform. Extract structured event JSON and audit ADA compliance. If the text mentions a series or institute, extract a child_sessions array. Return JSON only.`;
            const apiKey = "";

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: rawFlyerText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
              })
            });

            const data = await response.json();
            const textContent = data?.candidates?.[0]?.content?.parts?.[0]?.text;

              dateNum: "11",
              dayName: "FRI",
              month: "September 2026",
              monthKey: "2026-09",
              timeRange: "9:00 AM - 12:00 PM HST",
              delivery_mode: "f2f",
              deliveryLabel: "In-person (on campus)",
              location_details: "Learning Commons, Room 108",
              zoom_url: "",
              capacity_in_person: 25,
              capacity_virtual: 0,
              pedagogy_tags: ["Assessment", "Active Learning"],
              is_series: isFourPart,
              child_sessions: isFourPart ? [
                { num: 1, title: "Part 1: Foundations of Transparent Assessment", date: "Sep 11, 2026", time: "9:00 AM - 12:00 PM HST", location: "Room 108" },
                { num: 2, title: "Part 2: Formative Checkpoints & Peer Feedback", date: "Sep 18, 2026", time: "9:00 AM - 12:00 PM HST", location: "Room 108" },
                { num: 3, title: "Part 3: Authentic Rubrics in Lamakū", date: "Sep 25, 2026", time: "9:00 AM - 12:00 PM HST", location: "Room 108" },
                { num: 4, title: "Part 4: Assessment Showcase & Iteration", date: "Oct 2, 2026", time: "9:00 AM - 12:00 PM HST", location: "Room 108" }
              ] : [],
              ada_audit: {

                          <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Logistics & Access</h4>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div>
                              <label className="block font-bold text-slate-700 mb-1">Date & Time</label>
                              <input
                                type="text"
                                value={`${parsedResult.dateFull} • ${parsedResult.timeRange}`}
                                onChange={(e) => setParsedResult({ ...parsedResult, timeRange: e.target.value })}
                                className="w-full p-2 border rounded border-slate-300 bg-white focus:border-[#0E4D56] outline-none"
                              />
                            </div>
                            <div>
                              <label className="block font-bold text-slate-700 mb-1">Location Details</label>
                              <input
                                type="text"
                                value={parsedResult.location_details}
                                onChange={(e) => setParsedResult({ ...parsedResult, location_details: e.target.value })}
                                className="w-full p-2 border rounded border-slate-300 bg-white focus:border-[#0E4D56] outline-none"
                              />
                            </div>
                          </div>
                        </div>
                      </div>

                      {parsedResult.is_series && (
                        <div className="bg-[#FAF8F5] border border-slate-200 rounded-xl p-4 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-900 flex items-center gap-1.5">
                              <i className="fa-solid fa-layer-group text-[#0E4D56]"></i>
                              Rule 1 Compliance: Recurring Series Child Sessions ({parsedResult.child_sessions?.length || 4} sequence dates)
                            </span>
                            <span className="text-[10px] bg-emerald-100 text-emerald-800 font-semibold px-2 py-0.5 rounded">
                              Single RSVP for full series
                            </span>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            {(parsedResult.child_sessions || []).map((sess, idx) => (
                              <div key={idx} className="bg-white border border-slate-200 p-2.5 rounded-lg flex items-center justify-between">
                                <div className="space-y-0.5">
                                  <div className="font-bold text-slate-800">{sess.title}</div>
                                  <div className="text-[11px] text-slate-500">{sess.date} · {sess.time}</div>
                                </div>
                                <span className="text-[10px] text-slate-400 font-mono">Part {sess.num}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="flex justify-end space-x-3 pt-3 border-t border-slate-200">
                        <button
                          type="button"
                          onClick={() => setIntakeStep(1)}
                          className="px-4 py-2 border border-slate-300 rounded text-xs font-semibold text-slate-700 hover:bg-slate-50"
                        >
                          ← Back
                        </button>
                        <button
                          type="button"
                          onClick={handlePublish}
                          className="bg-[#18373E] hover:bg-[#0E4D56] text-white text-xs font-bold px-6 py-2 rounded shadow-xs flex items-center gap-1.5 transition-colors"
                        >
                          <i className="fa-solid fa-upload text-[11px]"></i>
                          <span>Publish to Discovery Catalog</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {activePage === "events" && (
                <div className="space-y-6">
                  <div className="flex flex-wrap justify-between items-end border-b border-slate-200 pb-4 gap-4">
                    <div>
                      <span className="text-[10px] uppercase tracking-wider font-bold text-slate-400 block">
                        DEPARTMENT-OWNED RECORDS
                      </span>
                      <h2 className="text-3xl font-serif font-medium text-slate-900 leading-tight">
                        Manage events
                      </h2>
                      <p className="text-xs text-slate-500 mt-1">
                        Edit, duplicate, reassign, cancel, restore, and audit opportunities without breaking registrations.
                      </p>
                    </div>

                    <button
                      onClick={() => setActivePage("intake")}
                      className="bg-[#18373E] hover:bg-[#0E4D56] text-white text-xs font-bold px-4 py-2 rounded-lg shadow-xs transition-colors"
                    >
                      + New event
                    </button>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase text-[10px]">
                          <th className="p-3.5">EVENT</th>
                          <th className="p-3.5">OWNER UNIT</th>
                          <th className="p-3.5">DATE</th>
                          <th className="p-3.5">AVAILABILITY</th>
                          <th className="p-3.5">STATUS</th>
                          <th className="p-3.5 text-right">ACTIONS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {events.slice(0, 4).map(evt => (
                          <tr key={evt.id} className="hover:bg-slate-50">
                            <td className="p-3.5 space-y-0.5">
                              <div className="font-bold text-slate-900">{evt.title}</div>
                              <div className="text-[11px] text-slate-500">{evt.deliveryLabel}</div>
                            </td>
                            <td className="p-3.5 text-slate-700">{evt.dept}</td>
                            <td className="p-3.5 text-slate-700">{evt.dateFull}</td>
                            <td className="p-3.5 text-slate-700">Open registration</td>
                            <td className="p-3.5">
                              <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">
                                Published
                              </span>
                            </td>
                            <td className="p-3.5 text-right space-x-2">
                              {/* Consolidated View Roster Action */}
                              <button 
                                onClick={() => showToast(`Exporting registration roster for "${evt.title}"...`, "success")}
                                className="px-2.5 py-1 rounded border border-slate-300 hover:bg-[#0E4D56] hover:text-white hover:border-[#0E4D56] font-semibold transition-colors flex items-center gap-1.5 inline-flex"
                              >
                                <i className="fa-solid fa-users text-[10px]"></i> View Roster
                              </button>
                              <button 
                                onClick={() => showToast(`Opening editor for "${evt.title}"`, "info")}
                                className="px-2.5 py-1 rounded border border-slate-300 hover:bg-slate-100 font-semibold transition-colors inline-flex"
                              >
                                Edit
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activePage === "analytics" && (
                <div className="space-y-6">
                  <div className="border-b border-slate-200 pb-4">
                    <span className="text-[10px] uppercase tracking-wider font-bold text-slate-400 block">
                      ALL EVENTS • UH ONLINE INNOVATION CENTER (UHOIC) VIEW
                    </span>
                    <h2 className="text-3xl font-serif font-medium text-slate-900 leading-tight">
                      Analytics & ROI
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Move from authorized unit results to event-level registration, attendance, campus reach, and permitted registrant details.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">REGISTRATIONS</span>
                      <div className="text-3xl font-serif font-bold text-slate-900 mt-1">86</div>
                      <div className="text-xs text-slate-500 mt-1">Across 4 selected events</div>
                    </div>

                    <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">VERIFIED ATTENDANCE</span>
                      <div className="text-3xl font-serif font-bold text-[#0E4D56] mt-1">71</div>
                      <div className="text-xs text-slate-500 mt-1">83% of past-event registrants</div>
                    </div>

                    <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">CAPACITY UTILIZED</span>
                      <div className="text-3xl font-serif font-bold text-purple-900 mt-1">86%</div>
                      <div className="text-xs text-slate-500 mt-1">86 registrations · 100 limit</div>
                    </div>

                    <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">CURRENT WAITLIST</span>
                      <div className="text-3xl font-serif font-bold text-amber-800 mt-1">0</div>
                      <div className="text-xs text-slate-500 mt-1">No one currently waiting</div>
                    </div>
                  </div>
                </div>
              )}

              {activePage === "attendance" && (
                <div className="space-y-6">
                  <div className="border-b border-slate-200 pb-4">
                    <span className="text-[10px] uppercase tracking-wider font-bold text-slate-400 block">
                      AUTHORIZED EVENT DATA
                    </span>
                    <h2 className="text-3xl font-serif font-medium text-slate-900 leading-tight">
                      Attendance sync
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Link a Zoom, Teams, or Meet session; normalize its report; and review uncertain matches before publishing attendance analytics.
                    </p>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-xs space-y-4">
                    <h3 className="font-bold text-sm text-slate-900">1. Link the event and report</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                      <div className="md:col-span-3">
                        <label className="block font-bold text-slate-700 mb-1">Authorized Event</label>
                        <select className="w-full p-2 border rounded border-slate-300 bg-white focus:border-[#0E4D56] outline-none">
                          <option>Innovation Playground: Fall '26 Updates: Gemini, NotebookLM, Vids</option>
                          <option>AI for Work: Build Your First Gemini Gem</option>
                        </select>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Provider</label>
                        <select className="w-full p-2 border rounded border-slate-300 bg-white focus:border-[#0E4D56] outline-none">
                          <option>Zoom</option>
                          <option>Microsoft Teams</option>
                          <option>Google Meet</option>
                        </select>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Meeting ID / UUID</label>
                        <input type="text" placeholder="771 2398 412" className="w-full p-2 border rounded border-slate-300 focus:border-[#0E4D56] outline-none" />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Attendance Threshold (%)</label>
                        <input type="number" defaultValue="50" className="w-full p-2 border rounded border-slate-300 focus:border-[#0E4D56] outline-none" />
                      </div>
                    </div>

                    <div className="flex space-x-3 pt-2">
                      <button 
                        onClick={() => showToast("Loaded sample attendance data for verification.", "info")}
                        className="bg-[#18373E] hover:bg-[#0E4D56] text-white text-xs font-bold px-4 py-2 rounded transition-colors"
                      >
                        Load representative sample
                      </button>
                      <button 
                        onClick={() => showToast("CSV parser ready for Zoom attendee report.", "info")}
                        className="border border-slate-300 hover:border-[#0E4D56] hover:text-[#0E4D56] text-slate-700 text-xs font-semibold px-4 py-2 rounded hover:bg-slate-50 transition-colors"
                      >
                        Import Provider CSV
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {activePage === "sources" && (
                <div className="space-y-6">
                  <div className="border-b border-slate-200 pb-4">
                    <span className="text-[10px] uppercase tracking-wider font-bold text-slate-400 block">
                      GOVERNED DISCOVERY SOURCES
                    </span>
                    <h2 className="text-3xl font-serif font-medium text-slate-900 leading-tight">
                      Event Sources
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Manage where opportunities are discovered, preserve organizer provenance, and review changes before they reach faculty.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">SOURCES IN SCOPE</span>
                      <div className="text-3xl font-serif font-bold text-slate-900 mt-1">2</div>
                      <div className="text-xs text-slate-500 mt-1">UH System · approved unit</div>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">HEALTHY</span>
                      <div className="text-3xl font-serif font-bold text-emerald-700 mt-1">1</div>
                      <div className="text-xs text-slate-500 mt-1">Ready for scheduled monitoring</div>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-xs">
                      <span className="text-[11px] font-bold uppercase text-slate-400">PENDING REVIEWS</span>
                      <div className="text-3xl font-serif font-bold text-amber-800 mt-1">2</div>
                      <div className="text-xs text-slate-500 mt-1">Field-level decisions required</div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
